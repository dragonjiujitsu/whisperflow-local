[project]
name = "whisperflow-local"
version = "0.1.0"
description = "100% local WhisperFlow clone - macOS dictation with a local AI cleanup pass"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.10.3",
    "sounddevice==0.5.1",
    "numpy==2.2.1",
    "lightning-whisper-mlx==0.0.10",
    "mlx==0.29.3",
    "mlx-metal==0.29.3",
    "pynput==1.7.7",
    "ollama==0.4.5",
    "PyYAML==6.0.2",
    "pyobjc-framework-Cocoa==12.2.1",
    "pyobjc-framework-ApplicationServices==12.2.1",
    "pyobjc-framework-AVFoundation==12.2.1",
]

[project.optional-dependencies]
test = [
    "pytest>=8.4,<10",
]
deploy = [
    "pip>=25.0",
    "Nuitka==2.7.11",
    "imageio>=2.37",
]

[project.scripts]
whisperflow-local = "whisperflow_local.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whisperflow_local"]
