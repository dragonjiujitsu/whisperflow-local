[project]
name = "whisperflow-local"
version = "0.1.0"
description = "100% local WhisperFlow clone — Windows dictation with a local AI cleanup pass"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6==6.8.1.1",
    "pywin32==308",
    "sounddevice==0.5.1",
    "numpy==2.2.1",
    "faster-whisper==1.1.1",
    "pynput==1.7.7",
    "pyperclip==1.9.0",
    "ollama==0.4.5",
    "PyYAML==6.0.2",
]

[project.scripts]
whisperflow-local = "whisperflow_local.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["whisperflow_local"]
